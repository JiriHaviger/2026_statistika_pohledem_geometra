
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="100" viewBox="0 0 1600 100">
  <defs>
    <style>
      .title { font-family: Sans-Serif; font-weight: 700; fill: #111; }
      .dice { fill: #fff; stroke: #111; stroke-width: 2; }
      .pip  { fill: #111; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="100" fill="#ffffff"/>

  <!-- Dice group (left) -->
  <g transform="translate(20,10)">
    <!-- die 1 -->
    <rect class="dice" x="0" y="0" rx="8" ry="8" width="64" height="64"/>
    <circle class="pip" cx="16" cy="16" r="5"/>
    <circle class="pip" cx="48" cy="48" r="5"/>

    <!-- die 2 -->
    <g transform="translate(54,12)">
      <rect class="dice" x="0" y="0" rx="8" ry="8" width="64" height="64"/>
      <circle class="pip" cx="16" cy="16" r="5"/>
      <circle class="pip" cx="32" cy="32" r="5"/>
      <circle class="pip" cx="48" cy="48" r="5"/>
    </g>

    <!-- die 3 -->
    <g transform="translate(108,-4)">
      <rect class="dice" x="0" y="0" rx="8" ry="8" width="64" height="64"/>
      <circle class="pip" cx="16" cy="16" r="5"/>
      <circle class="pip" cx="16" cy="48" r="5"/>
      <circle class="pip" cx="48" cy="16" r="5"/>
      <circle class="pip" cx="48" cy="48" r="5"/>
    </g>
  </g>

  <!-- Title -->
  <text class="title" x="220" y="62" font-size="48">Pravděpodobnost</text>
</
