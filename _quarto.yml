project:
  type: book
  output-dir: _book
  resources:
    - assets/   # sdílené moduly pro OJS (assets/jhrules.js), načítají se za běhu

lang: cs

book:
  title: " **Statistika pohledem geometra** "
  sidebar:
    logo: Logo.svg
    logo-alt: "Logo Statistika pohledem geometra"
    logo-href: index.html
  subtitle: "Poznámky z oblastí statistiky, pravděpodobnosti, s důrazem na vizualizaci pojmů a interaktivitu"
  author: "Jirka Haviger"
  date: today
  date-format: "D. M. YYYY"
  repo-url: https://github.com/JiriHaviger/2026_statistika_pohledem_geometra
  site-url: https://jirihaviger.github.io/2026_statistika_pohledem_geometra/
  chapters:
    - index.qmd
    - part: "**Pravděpodobnost**"
      chapters:
        - 01-pravdepodobnost/01-klasicka-prst.qmd
        - 01-pravdepodobnost/02-prst-pravidla.qmd
        - 01-pravdepodobnost/03-prst-distribuce.qmd
        - 01-pravdepodobnost/04-prst-diskretni.qmd
    - part: "**Deskriptivní statistika**"
      chapters:
        - 02-statistika/01-typy-promennych.qmd
        - 02-statistika/02-deskriptivni-statistiky-momenty.qmd
        - 02-statistika/03-aritmetika-dat.qmd
        - 02-statistika/04-deskriptivy-z-tabulky.qmd
        - 02-statistika/05-analyza-rozptylu-geometricky.qmd


format:
  html:
    theme: 
      # https://bootswatch.com/
      light: [cosmo,hag_custom.scss] #cosmo, flatly, sandstone 
      #cosmo, flatly, journal, lumen, paper, readable, sandstone, simplex, slate, spacelab, superhero, united, yeti
      dark: [cosmo, hag_custom.scss] 
      # light: [yeti, hag_custom.scss]
    code-fold: true
    code-tools: true
    code-copy: true
    # self-contained: true
    toc: true
    citations-hover: true
    citation-location: margin  
    mathjax: true
    open-graph: true
    twitter-card: true

bibliography: references.bib
csl: apa.csl   # lokální kopie (dřív se stahoval ze sítě při každém renderu)




